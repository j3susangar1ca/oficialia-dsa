# SISTEMA OFICIALIA-DIGITAL-DSA — Nginx sirviendo el build estático de Svelte 5
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/wasm image/svg+xml;

    # SPA: cualquier ruta no encontrada como archivo cae al index.html (la app no usa
    # router hoy — todo vive en un solo App.svelte — pero deja el servidor listo si eso
    # cambia, sin volver a tocar esta config).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los artefactos con hash en el nombre (assets de Vite) son inmutables — cache largo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
